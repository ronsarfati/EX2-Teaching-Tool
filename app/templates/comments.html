{% extends "base.html" %}
{% block title %}Comments{% endblock %}
{% block content %}
<h1>Comment or suggestion</h1>
{% if sent %}<p><strong>Thanks, sent anonymously.</strong></p>{% endif %}
<form method="post" action="{{ url_for('student.comments') }}">
  <label>Your comment (anonymous, 500 characters at most)
    <textarea name="text" maxlength="500" rows="5" required></textarea>
  </label>
  <button type="submit">Send</button>
</form>
<p><a href="{{ url_for('student.menu') }}">Back</a></p>
{% endblock %}
