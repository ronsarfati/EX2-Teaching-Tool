{% extends "base.html" %}
{% block title %}Lecturer login{% endblock %}
{% block content %}
<h1>Lecturer login</h1>
<form method="post" action="{{ url_for('lecturer.login') }}">
  <label>PIN
    <input type="password" name="pin" inputmode="numeric" autocomplete="off" required autofocus>
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
