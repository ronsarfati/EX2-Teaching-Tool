{% extends "base.html" %}
{% block title %}Lecturer login{% endblock %}
{% block content %}
<article class="cp-login">
  <h1>Lecturer login</h1>
  <form method="post" action="{{ url_for('lecturer.login') }}">
    <label>PIN
      <input class="cp-pin" type="password" name="pin" inputmode="numeric" autocomplete="off" required autofocus>
    </label>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
