{% extends "base.html" %}
{% block title %}Comments{% endblock %}
{% block content %}
<h1>Comments</h1>
<p id="comments-error" hidden>Connection problem, retrying...</p>
<p id="comments-empty">No comments yet.</p>
<ul id="comments-list"></ul>
<p><a href="{{ url_for('lecturer.dashboard') }}">Back</a></p>
<script>
// Short polling (D4). Comments are typed by students: textContent only, never innerHTML.
const list = document.getElementById("comments-list");
async function refresh() {
  try {
    const response = await fetch("{{ url_for('api.comments') }}", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    list.replaceChildren(...data.comments.map((c) => {
      const li = document.createElement("li");
      li.textContent = new Date(c.created_at * 1000).toLocaleTimeString("en-GB", { timeZone: "Asia/Jerusalem" }) + " - " + c.text;
      return li;
    }));
    document.getElementById("comments-empty").hidden = data.comments.length > 0;
    document.getElementById("comments-error").hidden = true;
  } catch (error) { document.getElementById("comments-error").hidden = false; }
}
refresh();
setInterval(refresh, 2500);
</script>
{% endblock %}
